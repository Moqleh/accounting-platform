name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_API_URL: ${{ vars.ACCOUNTING_BACKEND_ENABLED == 'true' && vars.ACCOUNTING_API_URL || '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate backend URL when enabled
        env:
          BACKEND_ENABLED: ${{ vars.ACCOUNTING_BACKEND_ENABLED }}
        run: |
          node <<'NODE'
          if (process.env.BACKEND_ENABLED === 'true') {
            const url = new URL(process.env.NEXT_PUBLIC_API_URL);
            if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash || !/\/api\/?$/.test(url.pathname)) {
              throw new Error('ACCOUNTING_API_URL must be a public HTTPS API URL ending in /api without credentials, query or fragment');
            }
          }
          NODE

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build static web app
        run: pnpm --filter @accounting/web build

      - name: Add nojekyll marker
        run: touch apps/web/out/.nojekyll

      - name: Publish to configured gh-pages source
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./apps/web/out
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
