name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: accounting
          POSTGRES_PASSWORD: accounting
          POSTGRES_DB: accounting
        ports: [5432:5432]
        options: >-
          --health-cmd="pg_isready -U accounting -d accounting"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://accounting:accounting@localhost:5432/accounting?schema=public
      JWT_SECRET: ci-only-not-for-production
      CORS_ORIGINS: http://localhost:3000
      SEED_ADMIN_PASSWORD: CI-Temporary-Admin-2026!
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @accounting/api prisma:generate
      - run: pnpm --filter @accounting/api exec prisma validate
      - run: pnpm --filter @accounting/api exec prisma db push --skip-generate
      - name: Apply database security invariants and extensions
        shell: bash
        run: |
          PSQL_URL="${DATABASE_URL%%\?*}"
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/security.sql
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/banking.sql
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/posting-config.sql
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/purchase-returns.sql
      - run: pnpm --filter @accounting/api prisma:seed
      - name: Verify database invariants
        shell: bash
        run: |
          PSQL_URL="${DATABASE_URL%%\?*}"
          psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f apps/api/prisma/qa-smoke.sql
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm -r build
      - name: Runtime API authentication smoke test
        shell: bash
        run: |
          pnpm --filter @accounting/api start > /tmp/accounting-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID 2>/dev/null || true; cat /tmp/accounting-api.log' EXIT
          for i in {1..30}; do
            if curl -fsS http://localhost:4000/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:4000/api/health >/dev/null
          LOGIN=$(curl -fsS -H 'Content-Type: application/json' -d '{"email":"admin@example.com","password":"CI-Temporary-Admin-2026!"}' http://localhost:4000/api/auth/login)
          TOKEN=$(node -e "const d=JSON.parse(process.argv[1]); if(!d.token) process.exit(1); process.stdout.write(d.token)" "$LOGIN")
          curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:4000/api/auth/me | grep -q 'admin@example.com'
      - name: Runtime web route smoke test
        shell: bash
        run: |
          python3 -m http.server 3000 --directory apps/web/out > /tmp/accounting-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill $WEB_PID 2>/dev/null || true; cat /tmp/accounting-web.log' EXIT
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/login/ >/dev/null; then break; fi
            sleep 1
          done
          routes=(/login/ / /sales/ /sales/new/ /sales/credit-notes/ /sales/credit-notes/new/ /purchases/ /purchases/new/ /purchases/debit-notes/ /purchases/debit-notes/new/ /customers/ /suppliers/ /inventory/ /payments/ /banking/ /expenses/ /journals/ /journals/new/ /reports/ /reports/trial-balance/ /reports/profit-loss/ /reports/balance-sheet/ /reports/customer-aging/ /reports/supplier-aging/ /reports/inventory-valuation/ /reports/account-activity/ /setup/ /users/ /audit/ /year-end/ /settings/)
          for route in "${routes[@]}"; do
            curl -fsS "http://localhost:3000$route" >/dev/null || { echo "Route failed: $route"; exit 1; }
          done
